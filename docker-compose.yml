services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: petal
      POSTGRES_PASSWORD: petal
      POSTGRES_DB: petalclub
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petal -d petalclub"]
      interval: 3s
      retries: 10

  web:
    build: .
    environment:
      DATABASE_URL: postgres://petal:petal@db:5432/petalclub
      PORT: 3000
    ports: ["3000:3000"]
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
